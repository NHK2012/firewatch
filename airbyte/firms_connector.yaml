version: 7.28.2

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - active_fire_observations

streams:
  - type: DeclarativeStream
    name: active_fire_observations
    retriever:
      type: SimpleRetriever
      decoder:
        type: CsvDecoder
        encoding: utf-8
        delimiter: ","
      requester:
        type: HttpRequester
        url: >-
          https://firms.modaps.eosdis.nasa.gov/api/area/csv/{{ config['map_key']
          }}/{{ config['source'] }}/{{ config['area'] }}/5/{{
          stream_interval.start_time }}
        http_method: GET
        error_handler:
          type: DefaultErrorHandler
          response_filters:
            - type: HttpResponseFilter
              action: FAIL
              http_codes:
                - 400
                - 401
                - 403
              error_message: FIRMS rejected the request (check map_key, source and area).
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
    primary_key: []
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        properties:
          version:
            type:
              - string
              - "null"
          latitude:
            type:
              - string
              - "null"
          longitude:
            type:
              - string
              - "null"
          bright_ti4:
            type:
              - string
              - "null"
          scan:
            type:
              - string
              - "null"
          track:
            type:
              - string
              - "null"
          acq_date:
            type: string
          acq_time:
            type:
              - string
              - "null"
          satellite:
            type:
              - string
              - "null"
          instrument:
            type:
              - string
              - "null"
          confidence:
            type:
              - string
              - "null"
          bright_ti5:
            type:
              - string
              - "null"
          frp:
            type:
              - string
              - "null"
          daynight:
            type:
              - string
              - "null"
          product:
            type:
              - string
              - "null"
        required:
          - acq_date
        additionalProperties: true
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - product
            value: "{{ config['source'] }}"
    incremental_sync:
      type: DatetimeBasedCursor
      step: P5D
      cursor_field: acq_date
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ now_utc().strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config['start_date'] }}"
        datetime_format: "%Y-%m-%d"
      datetime_format: "%Y-%m-%d"
      cursor_granularity: P1D
      cursor_datetime_formats:
        - "%Y-%m-%d"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - map_key
      - source
      - area
      - start_date
    properties:
      area:
        type: string
        description: "'world' or a bounding box west,south,east,north."
        order: 2
        title: Area
        default: world
      source:
        type: string
        description: >-
          FIRMS product. Use VIIRS_NOAA20_NRT (VIIRS_SNPP_NRT returned no data
          in our test; see NOTES).
        order: 1
        title: FIRMS product
        default: VIIRS_NOAA20_NRT
      map_key:
        type: string
        order: 0
        title: NASA FIRMS MAP_KEY
        airbyte_secret: true
      start_date:
        type: string
        description: First day to load, YYYY-MM-DD (30 or 90 days back, see guide 2.4).
        order: 3
        title: Start date
        format: date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    additionalProperties: true

metadata:
  testedStreams:
    active_fire_observations:
      isStale: false
      hasRecords: true
      streamHash: a7fea801ebbd83d7504abe7318d9bf14a74341ae
      hasResponse: true
      primaryKeysAreUnique: false
      primaryKeysArePresent: false
      responsesAreSuccessful: true
  autoImportSchema: {}
