version: 2

sources:
  - name: firewatch_raw
    description: NASA FIRMS active fire observations loaded by Airbyte.
    schema: "{{ var('raw_dataset', 'firewatch_raw') }}"
    tables:
      - name: active_fire_observations
        description: Raw VIIRS S-NPP near-real-time active fire detections.
        config:
          loaded_at_field: _airbyte_extracted_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
        columns:
          - name: latitude
            description: Observation latitude in decimal degrees.
          - name: longitude
            description: Observation longitude in decimal degrees.
          - name: bright_ti4
            description: VIIRS I-4 brightness temperature.
          - name: bright_ti5
            description: VIIRS I-5 brightness temperature.
          - name: scan
            description: Pixel scan dimension in kilometers, when supplied.
          - name: track
            description: Pixel track dimension in kilometers, when supplied.
          - name: acq_date
            description: Date on which the observation was acquired.
          - name: acq_time
            description: Acquisition time in the FIRMS HHMM format.
          - name: satellite
            description: Satellite identifier.
          - name: instrument
            description: Instrument identifier.
          - name: confidence
            description: Source confidence code or normalized confidence label.
          - name: version
            description: FIRMS product version.
          - name: frp
            description: Fire Radiative Power in megawatts, when supplied.
          - name: daynight
            description: Day/night indicator, typically D or N.
          - name: product
            description: FIRMS product identifier.
          - name: _airbyte_extracted_at
            description: Timestamp when Airbyte extracted the source record.
